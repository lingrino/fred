name: review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
      id-token: write
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          use_sticky_comment: true
          allowed_bots: renovate[bot]
          additional_permissions: |
            actions: read
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Read AGENTS.md first: it is the maintainer guide and explains Fred's measured,
            deliberate design (latency first, no caches, custom text field, layer-only rows,
            -Ounchecked core). Then review this pull request for:
            - Potential bugs or issues (in FredCore, release builds drop bounds checks)
            - Performance on the keystroke and hotkey paths
            - Code quality and consistency with AGENTS.md's rules
            - Security and privacy (no real personal data in tests, docs or messages)
            - Test coverage

            Be concise. Assume the author is familiar with the code and does not need
            lengthy explanations. Do not summarize the code or your thought process,
            just provide the review. Focus on what you think should be changed or improved.
          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'
